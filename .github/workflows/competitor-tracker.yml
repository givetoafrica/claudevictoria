name: Competitor Tracker

# Weekly snapshot of what the competition is publishing, and which of their
# videos broke out. History is the point — a single snapshot tells you who is
# big, a run of them tells you what is working right now.
#
# Uses yt-dlp rather than the YouTube Data API, matching
# scripts/fetch_channel_videos.py: no API key, no quota.

on:
  schedule:
    # Mondays 07:00 UTC. Early enough in the week to plan the week's uploads.
    - cron: "0 7 * * 1"
  workflow_dispatch:
  # Until this lands on main, schedule and manual dispatch are unavailable
  # (GitHub only registers those from the default branch). The path filter
  # keeps the job's own data commits from retriggering it.
  push:
    branches:
      - claude/youtube-audit-asmr-strategy-4f8wjz
      - claude/youtube-channel-inspiration-1exnkw
    paths:
      - ".github/workflows/competitor-tracker.yml"
      - "scripts/competitor_tracker.py"
      - "channels/african-natural-ambience/competitors.json"

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yt-dlp

      - name: Snapshot competitors
        run: |
          python scripts/competitor_tracker.py \
            --config channels/african-natural-ambience/competitors.json \
            --out channels/african-natural-ambience/tracking

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: competitor-report
          path: channels/african-natural-ambience/tracking/
          retention-days: 90

      # The push has to reconcile, not assume. This job runs against the ref
      # as it was when the run was queued, and the branch moves underneath it
      # -- a weekly schedule will eventually land on top of someone's push,
      # and a plain `git push` then fails AFTER the scan, throwing away the
      # run's data for a reason that has nothing to do with the data.
      - name: Commit snapshot
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels/african-natural-ambience/tracking/
          # Nothing to commit when a run lands on the same day as a previous one.
          if git diff --staged --quiet; then
            echo "No new tracking data to commit."
            exit 0
          fi
          git commit -m "Competitor tracking snapshot $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/$BRANCH (attempt $attempt)"
            git fetch origin "$BRANCH"
            # -X theirs favours the commit being replayed, i.e. this run's
            # snapshot. Two runs on the same day write the same filenames, and
            # the newer scan is the one worth keeping.
            git rebase -X theirs "origin/$BRANCH" || {
              git rebase --abort || true
              echo "::error::could not rebase onto origin/$BRANCH"
              exit 1
            }
            sleep $((attempt * 5))
          done
          echo "::error::push still rejected after 3 attempts"
          exit 1
