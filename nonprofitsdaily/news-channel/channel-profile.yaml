# Channel profile for the youtube-video-factory skill format. Fields marked NEEDS INPUT are not decided yet.
channel_name: "Nonprofitsdaily News"
target_audience: "Nonprofit CEOs, founders, executive directors and development directors"
format: "long"
video_length_target: "10-13 minutes weekly"
brand:
  colors: { primary: "#3B0B45", secondary: "#E8B547", background: "#FAF7F2", text: "#1C1421", accent: "#6C1FE0" }
  fonts: { headlines: "Georgia", body: "Arial" }
  tone: "Calm, mature, credible. Verified sources first, then Victoria's take. News, not teaching. Not political."
  taboo_topics:
    - "Politics and partisan commentary"
    - "Legal, tax or financial advice (education only; carries a disclaimer)"
    - "Give to Africa (never mentioned on Nonprofitsdaily)"
    - "Unverified claims stated as fact"
characters: []   # faceless; the source on screen is the visual
visual_rules:
  - "Show the real source page, scrolled and highlighted, with a SOURCE chip and CONFIRMED/UNCONFIRMED tag"
  - "US government sources in full; private publishers headline plus one excerpt only, credited"
  - "No stock footage, no avatar, no decorative logos"
voice:
  provider: "elevenlabs"
  voice_id_map: { narrator: "fK3Sm9ujL18r46zw0ri0" }   # Kayleigh. NEEDS INPUT: confirm, or use Victoria's own recorded/cloned voice
script_structure:
  - { segment: "cold_open", target_seconds: 40 }
  - { segment: "story_1_hook", target_seconds: 150 }
  - { segment: "story_2", target_seconds: 120 }
  - { segment: "story_3", target_seconds: 120 }
  - { segment: "story_4", target_seconds: 90 }
  - { segment: "thread_and_takeaway", target_seconds: 40 }
  - { segment: "cta", target_seconds: 20 }
seo:
  primary_keywords: ["nonprofit news", "donor advised funds", "nonprofit grants", "nonprofit regulation", "IRS nonprofit"]
  avoid_terms: ["politics", "election"]
disclaimer: "Education only, not legal, tax or financial advice. AI-generated narration."
production: "explainer-system, theme newsroom, scene type source (see explainer-system/README.md)"
