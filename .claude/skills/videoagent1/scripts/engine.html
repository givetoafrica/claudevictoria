<!doctype html>
<meta charset="utf-8">
<title>NonprofitsDaily video engine</title>
<style>
@font-face { font-family: "NPD Serif"; font-weight: 400; src: url("../assets/fonts/gelasio-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "NPD Serif"; font-weight: 700; src: url("../assets/fonts/gelasio-latin-700-normal.woff2") format("woff2"); }
:root {
  --plum: #3B0B45; --ivory: #FAF7F2; --ink: #1C1421; --violet: #6C1FE0; --gold: #E8B547; --lav: #D9C8F5; --grey: #9C92A3; --red: #C8453C;
  --serif: "NPD Serif", Georgia, "Liberation Serif", serif; --sans: Arial, "Liberation Sans", Helvetica, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { background: #000; overflow: hidden; }
#stage { position: relative; overflow: hidden; container-type: size; font-family: var(--sans); }
#stage.reel { width: 1080px; height: 1920px; --u: 1cqw; }
#stage.long { width: 1920px; height: 1080px; --u: 1cqh; }
#stage .bg { position: absolute; inset: 0; background: radial-gradient(110% 80% at 45% 40%, var(--bgA), var(--bgB)); }
#stage.dark { --bgA: #2a1f30; --bgB: #1C1421; --fg: var(--ivory); --fg2: var(--lav); --mk: var(--gold); --card: #fff; --cardfg: var(--ink); }
#stage .grid { position: absolute; inset: 0; opacity: .22; background-image: radial-gradient(circle, #fff 0.07u, transparent 0.08u); background-image: radial-gradient(circle, rgba(250,247,242,.55) calc(var(--u)*.08), transparent calc(var(--u)*.1)); background-size: calc(var(--u)*5) calc(var(--u)*5); }
.sc { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
.sc.plum { --bgA: #55185f; --bgB: #3B0B45; }
.sc.dark { --bgA: #2a1f30; --bgB: #1C1421; }
.sc.ivory { --bgA: #ffffff; --bgB: #EDE7DD; }
.sc .scbg { position: absolute; inset: 0; background: radial-gradient(110% 80% at 45% 40%, var(--bgA), var(--bgB)); }
.sc.dark, .sc.plum { --ul: rgba(232,181,71,.45); --fg: var(--ivory); --fg2: var(--lav); --key: var(--gold); --ghost: #7a6a82; --mark: var(--gold); }
.sc.ivory { --ul: rgba(108,31,224,.28); --fg: var(--plum); --fg2: var(--grey); --key: var(--violet); --ghost: #c4bccb; --mark: var(--plum); }
.sun { position: absolute; width: calc(var(--u)*34); height: calc(var(--u)*34); border-radius: 50%; background: var(--sunc, var(--violet)); opacity: .9; }
.sc.plum .sun, .sc.dark .sun { --sunc: var(--gold); opacity: .92; }
.head { position: absolute; font-family: var(--serif); color: var(--fg); letter-spacing: -0.02em; line-height: 1.12; }
.reel .head { left: calc(var(--u)*7); right: calc(var(--u)*12); top: 7%; text-align: center; font-size: calc(var(--u)*9.6); }
.long .head { left: 6%; width: 50%; top: 22%; text-align: left; font-size: calc(var(--u)*11.5); }
.chunk { display: none; } .chunk.on { display: block; }
.cw { display: inline-block; transform-origin: 50% 75%; color: var(--ghost); font-weight: 400; } .cw.k { font-weight: 700; background: linear-gradient(var(--ul), var(--ul)) no-repeat 0 90% / 0% 0.16em; } .cw.d { color: var(--fg); } .cw.k.d { color: var(--key); }
.hero { position: absolute; display: flex; align-items: center; justify-content: center; }
.reel .hero { --u: calc(1cqw * 1.38); left: 6%; right: 6%; top: 21%; bottom: 29%; }
.reel .hero.toonhero { top: 28%; bottom: 25%; }
.long .hero { --u: calc(1cqh * 1.3); left: 56%; right: 5%; top: 14%; bottom: 14%; }
.card { background: #fff; color: var(--ink); border-radius: calc(var(--u)*4); width: 100%; padding: calc(var(--u)*4.2); box-shadow: calc(var(--u)*1.4) calc(var(--u)*2.4) calc(var(--u)*5) calc(var(--u)*-1) rgba(0,0,0,.45); font-size: calc(var(--u)*3.3); }
.long .card { font-size: calc(var(--u)*3.3); }
.row { display: flex; align-items: center; gap: calc(var(--u)*2.6); padding: calc(var(--u)*2.4) calc(var(--u)*1.6); margin: 0 calc(var(--u)*-1.6); border-radius: calc(var(--u)*2); border-top: 1px solid #e6e1ea; }
.row:first-child { border-top: 0; }
.dot { width: calc(var(--u)*5.6); height: calc(var(--u)*5.6); flex: none; border-radius: calc(var(--u)*1.6); background: var(--lav); color: var(--plum); display: grid; place-items: center; font-weight: 700; font-size: calc(var(--u)*3); }
.row b { display: block; font-size: calc(var(--u)*3.8); } .row small { color: #6d6475; font-size: calc(var(--u)*2.8); }
.big { font-family: var(--serif); font-size: calc(var(--u)*17); line-height: 1; color: var(--plum); font-weight: 700; letter-spacing: -0.03em; }
.cap2 { color: #5d5265; margin-top: calc(var(--u)*2); font-size: calc(var(--u)*3.4); } .src { color: #8b8193; margin-top: calc(var(--u)*2); font-size: calc(var(--u)*2.6); }
.opt { border: calc(var(--u)*.3) solid #e6e1ea; border-radius: calc(var(--u)*3); padding: calc(var(--u)*3.4); } .opt + .opt { margin-top: calc(var(--u)*3); }
.opt.good { border-color: var(--violet); background: #f1eaff; } .lbl { text-transform: uppercase; letter-spacing: .08em; font-size: calc(var(--u)*2.7); color: #6d6475; display: block; margin-bottom: calc(var(--u)*1); }
.val { font-family: var(--serif); font-weight: 700; font-size: calc(var(--u)*9); line-height: 1; color: var(--plum); }
.tag { display: inline-block; margin-top: calc(var(--u)*1.4); font-size: calc(var(--u)*2.6); padding: calc(var(--u)*.6) calc(var(--u)*2); border-radius: 99px; background: var(--violet); color: #fff; font-weight: 700; }
.myth { opacity: .6; text-decoration: line-through; text-decoration-color: var(--gold); text-decoration-thickness: calc(var(--u)*.7); font-family: var(--serif); font-size: calc(var(--u)*4.4); color: #6d6475; }
.fact { font-family: var(--serif); font-weight: 700; font-size: calc(var(--u)*4.6); color: var(--plum); margin-top: calc(var(--u)*3); }
.quote { font-family: var(--serif); font-size: calc(var(--u)*4.8); color: var(--plum); line-height: 1.25; } .quote i { display: block; font-style: normal; color: var(--gold); font-size: calc(var(--u)*14); line-height: .6; margin-bottom: calc(var(--u)*2); }
.phone { position: relative; width: 100%; background: #14101a; border-radius: calc(var(--u)*6); padding: calc(var(--u)*3); box-shadow: calc(var(--u)*1.6) calc(var(--u)*2.6) calc(var(--u)*5) calc(var(--u)*-1) rgba(0,0,0,.6), inset 0 0 0 calc(var(--u)*.5) #3b3340; }
.cm { display: flex; gap: calc(var(--u)*2.2); align-items: center; padding: calc(var(--u)*1.6) 0; color: #efe9f3; font-size: calc(var(--u)*3); } .cm i { width: calc(var(--u)*5.4); height: calc(var(--u)*5.4); border-radius: 50%; background: #3f3547; flex: none; }
.cm span { display: block; color: #a597ad; font-size: calc(var(--u)*2.5); }
.notif { position: absolute; left: calc(var(--u)*-4); right: calc(var(--u)*-4); bottom: calc(var(--u)*-7); background: var(--plum); color: #fff; border-radius: calc(var(--u)*4); padding: calc(var(--u)*3.4) calc(var(--u)*3.8); font-size: calc(var(--u)*3.2); line-height: 1.3; outline: calc(var(--u)*.4) solid rgba(255,255,255,.14); opacity: 0; }
.notif small { display: block; color: var(--lav); font-size: calc(var(--u)*2.5); margin-bottom: calc(var(--u)*.8); } .notif em { font-style: normal; background: var(--gold); color: var(--ink); padding: 0 calc(var(--u)*1.2); border-radius: calc(var(--u)*1); font-weight: 700; }
.pill { position: absolute; background: var(--ink); color: #fff; font-weight: 700; font-size: calc(var(--u)*8.8); letter-spacing: -0.02em; padding: calc(var(--u)*2.2) calc(var(--u)*5); border-radius: calc(var(--u)*2.4); white-space: nowrap; box-shadow: calc(var(--u)*1.2) calc(var(--u)*2) calc(var(--u)*3.6) calc(var(--u)*-.8) rgba(0,0,0,.5); opacity: 0; font-family: var(--sans); }
.sc.dark .pill, .sc.plum .pill { background: var(--gold); color: var(--ink); }
.reel .pill { top: 79%; left: 50%; margin-left: 0; translate: -50% 0; }
.long .pill { top: 66%; left: 6%; font-size: calc(var(--u)*6.2); }
.mark { position: absolute; font-weight: 700; letter-spacing: .32em; color: var(--mark); font-size: calc(var(--u)*2.6); text-transform: uppercase; }
.reel .mark { left: 0; right: 0; top: 91%; text-align: center; } .long .mark { left: 6%; bottom: 6%; }
.series { position: absolute; font-weight: 700; letter-spacing: .3em; font-size: calc(var(--u)*2.6); color: var(--key); text-transform: uppercase; }
.reel .series { left: 7%; top: 4.2%; } .long .series { left: 6%; top: 16%; }
#av { position: absolute; z-index: 5; }
.reel #av { left: 4%; top: 70%; width: calc(var(--u)*20); height: calc(var(--u)*20); }
.long #av { right: 4%; bottom: 6%; width: calc(var(--u)*22); height: calc(var(--u)*22); }
#av .ring { position: absolute; inset: 0; border-radius: 50%; background: var(--gold); display: grid; place-items: center; overflow: hidden; }
#av img { position: absolute; inset: 4%; width: 92%; height: 92%; border-radius: 50%; object-fit: cover; }
#av .ph { position: absolute; inset: 4%; border-radius: 50%; background: var(--plum); color: var(--gold); display: grid; place-items: center; font-family: var(--serif); font-weight: 700; font-size: calc(var(--u)*8); }
#bub { position: absolute; background: var(--ivory); color: var(--plum); font-family: var(--serif); font-weight: 700; padding: calc(var(--u)*1.2) calc(var(--u)*3); border-radius: calc(var(--u)*3); font-size: calc(var(--u)*4.6); white-space: nowrap; opacity: 0; box-shadow: 0 calc(var(--u)*.8) calc(var(--u)*2) rgba(0,0,0,.35); }
.reel #bub { left: calc(var(--u)*13); top: calc(var(--u)*-6); } .long #bub { right: calc(var(--u)*14); top: calc(var(--u)*-6); }

.toon { width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.toon svg { width: 100%; height: 100%; overflow: visible; }
#av .toonwrap { position: absolute; inset: 4%; border-radius: 50%; overflow: hidden; background: var(--lav); }
#av .toonwrap svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.safe { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 20; }
.safe i { position: absolute; background: rgba(220,38,38,.18); outline: 1px dashed rgba(220,38,38,.8); }
body.safe-on .safe { display: block; }
</style>
<div id="stage">
  <div class="bg"></div>
  <div id="scenes"></div>
  <div id="av"><div class="ring"><div class="toonwrap" id="avtoon"></div><img id="avimg" alt=""></div><div id="bub"></div></div>
  <div class="safe"><i style="left:0;right:0;bottom:0;height:14%"></i><i style="top:0;bottom:14%;right:0;width:12%"></i></div>
</div>
<script>
const CONTENT = /*CONTENT*/ null;
(function () {
  const C = CONTENT, st = document.getElementById('stage');
  const fmt = C.format === 'long' ? 'long' : 'reel';
  st.className = fmt;
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  // ===== 2D cartoon Victoria: flat vector puppet, blink, lip sync from word timings =====
  const OUT = '#1a1214';
  const OUTFITS = {
    blue: { body: '#1f3fbf', shade: '#162e8f', inner: null },
    green: { body: '#14594a', shade: '#0e4237', inner: '#f3ecde' },
    plum: { body: '#3B0B45', shade: '#2b0833', inner: null },
  };
  let toonN = 0;
  function toonSVG(outfit) {
    const id = 'tn' + (toonN++), o = OUTFITS[outfit] || OUTFITS.blue, skin = '#8a5a3b', skinSh = '#74492f', lip = '#c2185b';
    const eye = (cx) => `<g class="${id}-eye" data-cx="${cx}"><ellipse cx="${cx}" cy="212" rx="19" ry="14" fill="#fff" stroke="${OUT}" stroke-width="4"/><circle class="${id}-iris" cx="${cx}" cy="213" r="9" fill="#2b1a14"/><circle cx="${cx + 3}" cy="209" r="3" fill="#fff"/><path d="M ${cx - 21} 207 Q ${cx} 193 ${cx + 21} 207" fill="none" stroke="${OUT}" stroke-width="6" stroke-linecap="round"/></g>`;
    const braid = (x, dir) => Array.from({ length: 9 }, (_, i) => `<ellipse cx="${x + dir * i * 1.5}" cy="${168 + i * 19}" rx="11" ry="10" fill="#1b1316" stroke="#3a2a30" stroke-width="2"/>`).join('');
    const top = o.inner
      ? `<path d="M 165 340 L 200 430 L 235 340 Z" fill="${o.inner}" stroke="${OUT}" stroke-width="4" stroke-linejoin="round"/><path d="M 150 335 L 198 440 L 168 345 Z M 250 335 L 202 440 L 232 345 Z" fill="${o.shade}" stroke="${OUT}" stroke-width="4" stroke-linejoin="round"/>`
      : `<path d="M 160 340 L 200 425 L 240 340 Z" fill="${skin}" stroke="${OUT}" stroke-width="4" stroke-linejoin="round"/><path d="M 140 335 L 202 432 L 175 345 Z M 260 335 L 198 432 L 225 345 Z" fill="${o.shade}" stroke="${OUT}" stroke-width="4" stroke-linejoin="round"/>`;
    const svg = `<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
      <g id="${id}-all">
        <ellipse cx="200" cy="492" rx="150" ry="14" fill="rgba(0,0,0,.18)"/>
        <g id="${id}-body">
          <path d="M 10 500 C 10 410 60 360 140 342 L 260 342 C 340 360 390 410 390 500 Z" fill="${o.body}" stroke="${OUT}" stroke-width="5" stroke-linejoin="round"/>
          <rect x="165" y="285" width="70" height="70" rx="26" fill="${skin}" stroke="${OUT}" stroke-width="4"/>
          ${top}
          <g id="${id}-handL"><ellipse cx="115" cy="455" rx="34" ry="26" fill="${skin}" stroke="${OUT}" stroke-width="5"/><path d="M 92 440 Q 108 428 128 438" fill="none" stroke="${skinSh}" stroke-width="4" stroke-linecap="round"/></g>
          <g id="${id}-handR"><ellipse cx="285" cy="455" rx="34" ry="26" fill="${skin}" stroke="${OUT}" stroke-width="5"/><path d="M 272 438 Q 292 428 308 440" fill="none" stroke="${skinSh}" stroke-width="4" stroke-linecap="round"/></g>
        </g>
        <g id="${id}-head">
          <g>${braid(112, -1)}${braid(288, 1)}</g>
          <ellipse cx="200" cy="112" rx="104" ry="74" fill="#1b1316" stroke="${OUT}" stroke-width="5"/>
          <ellipse cx="113" cy="222" rx="13" ry="22" fill="${skin}" stroke="${OUT}" stroke-width="4"/><ellipse cx="287" cy="222" rx="13" ry="22" fill="${skin}" stroke="${OUT}" stroke-width="4"/>
          <circle cx="113" cy="250" r="8" fill="#e8b547" stroke="${OUT}" stroke-width="3"/><circle cx="287" cy="250" r="8" fill="#e8b547" stroke="${OUT}" stroke-width="3"/>
          <ellipse cx="200" cy="212" rx="90" ry="102" fill="${skin}" stroke="${OUT}" stroke-width="5"/>
          <path d="M 108 190 C 106 108 294 108 292 190 C 276 146 238 132 200 132 C 162 132 124 146 108 190 Z" fill="#1b1316" stroke="${OUT}" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 200 128 C 190 140 170 150 140 160 M 200 128 C 210 140 230 150 260 160 M 200 128 L 200 150" fill="none" stroke="#3a2a30" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="142" cy="256" rx="20" ry="11" fill="#b4543c" opacity=".35"/><ellipse cx="258" cy="256" rx="20" ry="11" fill="#b4543c" opacity=".35"/>
          ${eye(162)}${eye(238)}
          <path id="${id}-browL" d="M 138 186 Q 162 172 186 184" fill="none" stroke="${OUT}" stroke-width="7" stroke-linecap="round"/>
          <path id="${id}-browR" d="M 214 184 Q 238 172 262 186" fill="none" stroke="${OUT}" stroke-width="7" stroke-linecap="round"/>
          <path d="M 193 250 Q 200 260 207 250" fill="none" stroke="${skinSh}" stroke-width="4" stroke-linecap="round"/>
          <path id="${id}-mouth" d="" fill="#5a1222" stroke="${lip}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
        </g>
      </g></svg>`;
    return { id, svg };
  }
  function vowelShape(w) { const m = (w || '').toLowerCase().match(/[aeiou]/); if (!m) return 'mid'; return m[0] === 'o' || m[0] === 'u' ? 'round' : (m[0] === 'a' ? 'wide' : 'mid'); }
  function updateToon(id, t, words, react) {
    const q = (sel) => document.getElementById(id + '-' + sel);
    // mouth
    let a = 0, shape = 'mid';
    for (let i = 0; i < words.length; i++) { const w = words[i]; if (t >= w.start - 0.02 && t <= w.end + 0.04) { const p = clamp((t - w.start) / Math.max(0.12, w.end - w.start)); a = Math.pow(Math.sin(Math.PI * p), 0.6); shape = vowelShape(w.t); if (p > 0.6 && w.t.length > 4) shape = 'mid'; break; } }
    const mouth = q('mouth'), cx = 200, y0 = 288;
    if (a < 0.06) mouth.setAttribute('d', `M ${cx - 17} ${y0} Q ${cx} ${y0 + 9} ${cx + 17} ${y0}`), mouth.setAttribute('fill', 'none');
    else {
      const hw = shape === 'round' ? 11 : shape === 'wide' ? 20 : 16, h = (shape === 'round' ? 20 : shape === 'wide' ? 24 : 17) * a;
      mouth.setAttribute('fill', '#5a1222');
      mouth.setAttribute('d', `M ${cx - hw} ${y0} Q ${cx} ${y0 - 5} ${cx + hw} ${y0} Q ${cx + hw * 0.9} ${y0 + h + 6} ${cx} ${y0 + h + 6} Q ${cx - hw * 0.9} ${y0 + h + 6} ${cx - hw} ${y0} Z`);
    }
    // blink
    const ph = t % 3.4, blink = ph < 0.16 ? Math.abs(Math.sin(Math.PI * ph / 0.16)) : 0, b = 1 - 0.92 * blink;
    document.querySelectorAll('.' + id + '-eye').forEach((e) => { const ecx = e.dataset.cx; e.setAttribute('transform', `translate(${ecx},212) scale(1,${b.toFixed(3)}) translate(${-ecx},-212)`); });
    // brows, head sway, body bob, hands
    const lift = react ? 8 * Math.sin(Math.PI * clamp((react.t) / 0.7)) : 0;
    q('browL').setAttribute('transform', `translate(0,${-lift - a * 3})`); q('browR').setAttribute('transform', `translate(0,${-lift - a * 3})`);
    const sway = Math.sin(t * 1.4) * 1.6 + a * Math.sin(t * 9) * 1.2;
    q('head').setAttribute('transform', `rotate(${sway.toFixed(2)} 200 330) translate(0,${(Math.sin(t * 2.2) * 2 - a * 2).toFixed(2)})`);
    const hand = a > 0.05 ? Math.sin(t * 7) * 6 : Math.sin(t * 1.6) * 2;
    q('handL').setAttribute('transform', `translate(${hand * 0.5},${-hand - lift * 2})`); q('handR').setAttribute('transform', `translate(${-hand * 0.5},${hand - lift * 2})`);
  }
  const img = document.getElementById('avimg');
  const avatarMode = C.avatarMode || (fmt === 'long' ? 'cartoon' : 'none');   // cartoon | photo | none (reels default to none)
  let avMissing = false; img.onerror = () => { avMissing = true; };
  img.src = (C.avatar || '../assets/avatar.png');
  let avToon = null;
  if (avatarMode === 'cartoon') { avToon = toonSVG(C.outfit); document.getElementById('avtoon').innerHTML = avToon.svg.replace('viewBox="0 0 400 500"', 'viewBox="40 60 320 320"'); img.style.display = 'none'; }
  else if (avatarMode === 'photo') { document.getElementById('avtoon').style.display = 'none'; }

  // ---- parse say text: chunks '|' and *bold* ----
  const scenes = C.scenes;
  let inK = false;
  scenes.forEach((s) => {
    s.chunks = s.say.split('|').map((c) => c.trim().split(/\s+/).map((w) => {
      const starts = w[0] === '*'; if (starts) inK = true; const k = inK; if (w.slice(starts ? 1 : 0).indexOf('*') >= 0) inK = false;
      return { t: w.replace(/\*/g, ''), k };
    }));
    s.words = [].concat(...s.chunks);
  });
  // ---- timing: from real alignment (C.timing = [{w,start,end}] across all words) or an estimate ----
  const all = [].concat(...scenes.map((s) => s.words));
  let ti = 0, clock = 0.6;
  if (C.timing && C.timing.length === all.length) {
    all.forEach((w, i) => { w.start = C.timing[i].start; w.end = C.timing[i].end; });
  } else {
    scenes.forEach((s) => {
      s.chunks.forEach((ch) => { ch.forEach((w) => { const d = 0.1 + 0.052 * w.t.length; w.start = clock; w.end = clock + d; clock += d + (/[.?!]$/.test(w.t) ? 0.35 : /,$/.test(w.t) ? 0.18 : 0.04); }); clock += 0.1; });
      clock += 0.5;
    });
  }
  let prevEnd = 0;
  scenes.forEach((s, i) => {
    const w0 = s.words[0].start, w1 = s.words[s.words.length - 1].end;
    s.t0 = i === 0 ? 0 : Math.max(prevEnd, w0 - 0.55);
    s.t1 = i === scenes.length - 1 ? w1 + 1.6 : Math.max(w1 + 0.35, s.t0 + 2.2);
    prevEnd = s.t1; s.cs = s.chunks.map((ch) => ch[0].start);
  });
  const total = scenes[scenes.length - 1].t1;

  // ---- hero builders ----
  function hero(h) {
    if (!h) return '';
    if (h.kind === 'list') return '<div class="card">' + h.items.map((it, i) => `<div class="row" data-key="${esc(it.key || '')}"><span class="dot">${it.n || i + 1}</span><div><b>${esc(it.t)}</b><small>${esc(it.s || '')}</small></div></div>`).join('') + '</div>';
    if (h.kind === 'compare') return `<div class="card"><div class="opt"><span class="lbl">${esc(h.a.label)}</span><div class="val">${esc(h.a.value)}</div></div><div class="opt good"><span class="lbl">${esc(h.b.label)}</span><div class="val">${esc(h.b.value)}</div>${h.b.tag ? '<span class="tag">' + esc(h.b.tag) + '</span>' : ''}</div></div>`;
    if (h.kind === 'stat') return `<div class="card" style="text-align:center"><div class="big">${esc(h.number)}</div><div class="cap2">${esc(h.caption)}</div><div class="src">${esc(h.source || '')}</div></div>`;
    if (h.kind === 'myth') return `<div class="card"><div class="myth">${esc(h.myth)}</div><div class="fact">${esc(h.fact)}</div></div>`;
    if (h.kind === 'cartoon') { const T = toonSVG(h.outfit); h.__id = T.id; return `<div class="toon">${T.svg}</div>`; }
    if (h.kind === 'follow') return `<div class="card" style="text-align:center"><div class="val" style="font-size:calc(var(--u)*5.4)">${esc(h.handle || '@nonprofitsdaily')}</div><div class="cap2">${esc(h.line || 'Follow for more nonprofit tips.')}</div></div>`;
    if (h.kind === 'quote') return `<div class="card"><div class="quote"><i>&ldquo;</i>${esc(h.text)}</div></div>`;
    if (h.kind === 'phone') return `<div class="phone">${[1, 2, 3, 4].map((n) => `<div class="cm"><i></i><div>user_0${n}<span>${esc(h.keyword)}</span></div></div>`).join('')}<div class="notif" data-key="${esc(h.notifKey || '')}"><small>@nonprofitsdaily &middot; now</small>${esc(h.notif || '')}</div></div>`;
    return '';
  }
  const host = document.getElementById('scenes');
  scenes.forEach((s) => {
    const el = document.createElement('section');
    el.className = 'sc ' + (s.bg || 'plum');
    el.innerHTML = `<div class="scbg"></div><div class="grid"></div><div class="sun" style="${esc(s.sun || (fmt === 'reel' ? 'right:-17cqw;top:-17cqw' : 'right:-8cqh;top:-17cqh'))}"></div>` +
      (s.series ? `<div class="series">${esc(s.series)}</div>` : '') +
      `<div class="head">${s.chunks.map((ch, ci) => `<div class="chunk" data-c="${ci}">${ch.map((w, wi) => `<span class="cw${w.k ? ' k' : ''}" data-w="${ci}-${wi}">${esc(w.t)}</span>`).join(' ')}</div>`).join('')}</div>` +
      `<div class="hero${s.hero && s.hero.kind === 'cartoon' ? ' toonhero' : ''}">${hero(s.hero)}</div>` + (s.pill ? `<div class="pill">${esc(s.pill)}</div>` : '') + `<div class="mark">NonprofitsDaily</div>`;
    s.el = el; s.head = el.querySelector('.head'); s.heroEl = el.querySelector('.hero > *'); s.pillEl = el.querySelector('.pill');
    s.chunkEls = [...el.querySelectorAll('.chunk')]; s.wordEls = [...el.querySelectorAll('.cw')];
    s.rows = [...el.querySelectorAll('[data-key]')];
    s.rows.forEach((r) => { const k = norm(r.dataset.key); r.keyWord = k ? s.words.find((w) => norm(w.t) === k) : null; });
    host.appendChild(el);
  });

  const bub = document.getElementById('bub'), av = document.getElementById('av');

  const easeOutBack = (x) => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const spring = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : easeOutBack(x));
  window.__total = total;
  scenes.forEach((s) => { s.items = [...s.el.querySelectorAll('.row, .cm, .opt')]; s.sunEl = s.el.querySelector('.sun'); s.gridEl = s.el.querySelector('.grid'); s.notifEl = s.el.querySelector('.notif'); });

  let fitted = false;
  function fitPills() {
    fitted = true; const maxW = st.clientWidth * (fmt === 'reel' ? 0.86 : 0.5);
    scenes.forEach((s) => { const p = s.pillEl; if (!p) return; s.el.style.visibility = 'visible'; s.el.style.opacity = 0; const w = p.scrollWidth; if (w > maxW) p.style.fontSize = `calc(var(--u) * ${(8.8 * maxW / w).toFixed(2)})`; });
  }
  window.__render = function (t) {
    if (!fitted) fitPills();
    let toonA = 0;
    scenes.forEach((s, i) => {
      const inP = ease((t - s.t0) / 0.55), outP = ease((t - s.t1) / 0.4), a = inP * (1 - outP);
      s.el.style.opacity = a; s.el.style.visibility = a > 0.001 ? 'visible' : 'hidden';
      if (s.hero && s.hero.kind === 'cartoon') toonA = Math.max(toonA, a);
      if (a <= 0.001) return;
      const prog = clamp((t - s.t0) / (s.t1 - s.t0));
      s.el.style.transform = `translateX(${(1 - inP) * 3 - outP * 3}cqw)`;
      // living background: drifting dot grid, breathing sun
      s.sunEl.style.transform = `scale(${0.7 + 0.3 * ease((t - s.t0) / 0.7)})`;
      // current chunk wipes in left to right
      let ci = 0; s.cs.forEach((c, k) => { if (t >= c - 0.05) ci = k; });
      s.chunkEls.forEach((c, k) => c.classList.toggle('on', k === ci));
      s.chunkEls[ci].style.clipPath = `inset(-20% ${(1 - ease((t - (s.cs[ci] - 0.05)) / 0.35)) * 100}% -20% 0)`;
      // words: ink in, pop, key words get an underline sweep
      s.words.forEach((w, k) => {
        const e = s.wordEls[k]; if (!e) return;
        const on = t >= w.start; e.classList.toggle('d', on);
        const q = clamp((t - w.start) / 0.3);
        if (w.k) e.style.backgroundSize = `${on ? ease((t - w.start) / 0.4) * 100 : 0}% 0.16em`;
      });
      // hero springs in, then floats
      const hq = (t - s.t0 - 0.25) / 0.75, hp = spring(hq);
      if (s.heroEl) {
        s.heroEl.style.opacity = clamp(hq * 3);
        s.heroEl.style.transform = `translateY(${(1 - ease(hq)) * 3}cqh)`;
      }
      if (s.hero && s.hero.__id) updateToon(s.hero.__id, t, s.words, null);
      // pill pops with a little tilt
      if (s.pillEl) {
        const pq = (t - s.t0 - 1.1) / 0.5, pp = spring(pq);
        s.pillEl.style.opacity = clamp(pq * 4);
        s.pillEl.style.transform = `translateY(${(1 - ease(pq)) * 2}cqh)`;
      }
      // staggered items: rows slide up, comments rise, options come from both sides
      s.items.forEach((el, k) => {
        const iq = (t - s.t0 - 0.3) / 0.4, ip = 1, pres = clamp(iq * 2);
        if (el.classList.contains('row')) {
          const hasKey = !!el.dataset.key, on = el.keyWord ? t >= el.keyWord.start : !hasKey;
          const bump = 0;
          el.style.opacity = pres * (on ? 1 : 0.42);
          el.style.background = on && hasKey ? '#f3ebff' : 'transparent';
          el.style.transform = 'none';
        } else if (el.classList.contains('cm')) {
          el.style.opacity = pres; el.style.transform = 'none';
        } else {
          el.style.opacity = pres; el.style.transform = 'none';
        }
      });
      if (s.notifEl) {
        const kw = s.rows.find((r) => r.classList.contains('notif'));
        const start = kw && kw.keyWord ? kw.keyWord.start : Infinity;
        const nq = (t - start) / 0.4;
        s.notifEl.style.opacity = clamp(nq * 2);
        s.notifEl.style.transform = `translateY(${(1 - ease(nq)) * 4}cqw)`;
      }
    });
    // Victoria avatar: idle bob, bigger hop and wiggle on a reaction
    let cur = scenes.find((s) => t >= s.t0 && t < s.t1) || scenes[scenes.length - 1];
    const rt = t - cur.t0 - 0.35;
    let bob = Math.sin(t * 3.2) * 0.35, wig = 0;
    if (cur.react && rt > -0.01) {
      bub.textContent = cur.react;
      const bp = spring(rt / 0.35), fade = 1 - clamp((rt - 1.6) / 0.3);
      bub.style.opacity = clamp(rt * 6) * fade; bub.style.transform = `scale(${0.3 + 0.7 * bp}) rotate(${(1 - bp) * -10}deg)`;
      if (rt < 0.7) bob -= Math.sin(Math.PI * clamp(rt / 0.6)) * 2.6;
      if (rt > 0.3 && rt < 1.2) wig = Math.sin((rt - 0.3) * 24) * 6 * (1 - (rt - 0.3) / 0.9);
    } else { bub.style.opacity = 0; }
    av.style.transform = `translateY(${bob}cqh) rotate(${wig}deg)`;
    av.style.opacity = (cur.noAvatar || avatarMode === 'none' || (avatarMode === 'photo' && avMissing)) ? 0 : (1 - toonA);
    if (avToon) updateToon(avToon.id, t, all, cur.react && rt > 0 ? { t: rt } : null);
  };
  window.__render(0);
  // preview: open with ?play to run in a normal browser, ?t=12.5 to freeze a moment, ?safe to show safe zones
  const q = new URLSearchParams(location.search);
  if (q.has('safe')) document.body.classList.add('safe-on');
  if (q.has('t')) window.__render(parseFloat(q.get('t')));
  if (q.has('play')) { const t0 = performance.now(); (function tick() { const t = (performance.now() - t0) / 1000; window.__render(t); if (t < total) requestAnimationFrame(tick); })(); }
})();
</script>
